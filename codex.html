<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐙 Le Grimoire de Dreadthulhu — Codex du Mythe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Cinzel:wght@500;700;900&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --abyss-0:#06030d;--abyss-1:#120a26;--abyss-2:#1d1140;--abyss-3:#2e1a5e;--abyss-4:#432685;
  --purple-glow:#7c4dff;--orange:#ff6a1a;--orange-bright:#ffae42;
  --teal:#2de8c4;--gold:#ffd166;--pink:#d98fff;--ink:#f3ecff;
  --muted:#a896d1;--muted-2:#7a6aa3;
  --font-display:'Pirata One',serif;--font-eng:'Cinzel',serif;
  --font-body:'Manrope',sans-serif;--font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;background:radial-gradient(ellipse 1200px 700px at 18% -10%,rgba(124,77,255,.28),transparent 60%),
  radial-gradient(ellipse 900px 600px at 100% 10%,rgba(255,106,26,.10),transparent 55%),
  radial-gradient(ellipse 1000px 900px at 50% 110%,rgba(45,232,196,.06),transparent 60%),var(--abyss-0);
  color:var(--ink);font-family:var(--font-body);line-height:1.55;min-height:100vh;overflow-x:hidden;}
::-webkit-scrollbar{width:10px;}
::-webkit-scrollbar-track{background:var(--abyss-0);}
::-webkit-scrollbar-thumb{background:var(--abyss-4);border-radius:6px;}
a{color:var(--orange-bright);}
.wrap{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:0 20px 80px;}

header.hero{text-align:center;padding:64px 16px 36px;}
.hero-glyph{font-size:50px;display:inline-block;margin-bottom:6px;filter:drop-shadow(0 0 22px var(--purple-glow));animation:float 5s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-10px) rotate(2deg);}}
h1.title{font-family:var(--font-display);font-size:clamp(34px,6vw,66px);margin:0;
  background:linear-gradient(180deg,#fff 0%,var(--pink) 55%,var(--purple-glow) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.08;}
p.subtitle{font-family:var(--font-eng);letter-spacing:2.5px;text-transform:uppercase;font-size:12.5px;color:var(--muted);margin:12px 0 0;font-weight:600;}
.hero-rule{width:200px;height:2px;margin:24px auto;border:none;background:linear-gradient(90deg,transparent,var(--purple-glow),var(--pink),transparent);}

/* ── Progression ─── */
.progress-card{background:linear-gradient(160deg,var(--abyss-1) 0%,var(--abyss-2) 100%);
  border:1px solid var(--abyss-4);border-radius:20px;padding:30px clamp(18px,4vw,42px);
  box-shadow:0 30px 80px -30px rgba(0,0,0,.7);position:relative;overflow:hidden;margin-bottom:40px;}
.progress-card::before{content:"🐙";position:absolute;right:-30px;bottom:-50px;font-size:220px;opacity:.05;pointer-events:none;}
.progress-top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:10px;position:relative;}
.progress-top .big{font-family:var(--font-display);font-size:clamp(30px,5vw,46px);color:var(--ink);}
.progress-top .big b{color:var(--teal);}
.progress-top .pct{font-family:var(--font-mono);font-size:22px;color:var(--orange-bright);font-weight:700;}
.bar-track{margin-top:16px;height:16px;border-radius:10px;background:var(--abyss-0);border:1px solid var(--abyss-3);overflow:hidden;position:relative;}
.bar-fill{height:100%;border-radius:10px;background:linear-gradient(90deg,var(--purple-glow),var(--pink),var(--orange));
  box-shadow:0 0 16px rgba(217,143,255,.5);transition:width 1.2s cubic-bezier(.2,.8,.3,1);width:0%;}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:24px;position:relative;}
.cat-pill{background:rgba(6,3,13,.45);border:1px solid var(--abyss-4);border-radius:12px;padding:10px 14px;}
.cat-pill .label{font-family:var(--font-eng);font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;}
.cat-pill .label b{color:var(--teal);font-family:var(--font-mono);}
.cat-pill .track{height:6px;border-radius:6px;background:var(--abyss-0);overflow:hidden;}
.cat-pill .fill{height:100%;background:linear-gradient(90deg,var(--purple-glow),var(--orange));}

/* ── Grille des fiches ─── */
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;margin-top:10px;}
.card{border-radius:16px;padding:20px 20px 18px;background:rgba(18,10,38,.9);border:1px solid var(--abyss-4);
  box-shadow:0 6px 24px rgba(0,0,0,.4);transition:box-shadow .15s,border-color .15s,transform .15s;position:relative;overflow:hidden;}
.card:hover{border-color:var(--purple-glow);box-shadow:0 10px 30px rgba(124,77,255,.3);transform:translateY(-2px);}
.card .cat{font-family:var(--font-eng);font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--orange-bright);margin-bottom:8px;display:block;}
.card h3{font-family:var(--font-display);font-size:24px;margin:0 0 10px;color:var(--ink);line-height:1.15;}
.card p{font-size:13.5px;color:#cfc3ec;margin:0 0 10px;}
.card .aliases{font-family:var(--font-mono);font-size:11px;color:var(--muted-2);border-top:1px dashed var(--abyss-4);padding-top:10px;margin-top:4px;}

.card.sealed{background:rgba(8,5,16,.75);border-style:dashed;text-align:center;padding:34px 18px;}
.card.sealed .lock{font-size:34px;opacity:.65;margin-bottom:10px;filter:grayscale(.2);}
.card.sealed .cat{color:var(--muted-2);}
.card.sealed h3{font-family:var(--font-eng);font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--muted-2);margin:0;}
.card.sealed p{color:var(--muted-2);font-size:12px;margin-top:8px;}

footer{text-align:center;margin-top:60px;font-family:var(--font-mono);font-size:11.5px;color:var(--muted-2);}
footer a{color:var(--muted);}
</style>
</head>

    <span class="hero-glyph">📖</span>

    <hr class="hero-rule">

      <div class="pct" id="stat-pct">0%</div>
    </div>
    <div class="bar-track"><div class="bar-fill" id="bar-fill"></div></div>
    <div class="cat-grid" id="cat-grid"></div>
  </section>

  <div id="grid"></div>

  <footer id="footer"></footer>
</div>

<script>
let DATA = {"entries":[],"total":0,"found":0,"percent":0,"by_category":{},"generated_at":""};
try {
  DATA = JSON.parse(document.getElementById('codex-data').textContent);
} catch (e) {
  console.warn('[Codex] données illisibles, page vide affichée', e);
}

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

function render() {
  document.getElementById('stat-found').textContent = DATA.found;
  document.getElementById('stat-total').textContent = DATA.total;
  document.getElementById('stat-pct').textContent = DATA.percent + '%';
  requestAnimationFrame(() => {
    document.getElementById('bar-fill').style.width = DATA.percent + '%';
  });

  const catGrid = document.getElementById('cat-grid');
  const order = Object.keys(DATA.by_category);
  order.forEach(cat => {
    const c = DATA.by_category[cat];
    const pct = c.total ? Math.round(100 * c.found / c.total) : 0;
    const pill = el('div', 'cat-pill');
    pill.innerHTML = `<div class="label"><span>${cat}</span><b>${c.found}/${c.total}</b></div>
      <div class="track"><div class="fill" style="width:${pct}%"></div></div>`;
    catGrid.appendChild(pill);
  });

  const grid = document.getElementById('grid');
  DATA.entries.forEach(entryData => {
    if (entryData.found) {
      const card = el('div', 'card');
      const aliasesHtml = (entryData.aliases && entryData.aliases.length)
        ? `<div class="aliases">Aussi connu sous : ${entryData.aliases.filter(a => a.toLowerCase() !== entryData.name.toLowerCase()).join(', ') || '—'}</div>`
        : '';
      card.innerHTML = `<span class="cat">${entryData.category}</span>
        <h3>${entryData.name}</h3>
        <p>${entryData.summary}</p>
        ${aliasesHtml}`;
      grid.appendChild(card);
    } else {
      const card = el('div', 'card sealed');
      card.innerHTML = `<div class="lock">🔒</div><h3>Fiche scellée</h3><p>Pas encore révélée en live — tape <b>!codex</b> !</p>`;
      grid.appendChild(card);
    }
  });

  document.getElementById('footer').innerHTML =
    `Généré automatiquement le ${DATA.generated_at} — Dreadthulhu, bot du culte de <a href="#">Dreadlocktopus</a>`;
}

render();
</script>
